name: ML - single-site radar assignment

# Single-site stage 1: match every hand-made track point to the NEXRAD whose volume started at that
# time (ml/l2_assign.py). Result is committed to ml/l2/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install numpy pandas requests matplotlib
      - run: python ml/l2_assign.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ml/l2
          git commit -m "ML: single-site radar assignment of track points" || exit 0
          git pull --rebase && git push
