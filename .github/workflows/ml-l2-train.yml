name: ML - single-site training

# Single-site stage 4 (ml/l2_train.py): train MesoNet on the Level II patches on CPU.
on:
  workflow_dispatch:
    inputs:
      patches_tag:
        default: "ml-l2-patches-v1"
      tag:
        default: "ml-l2-model-v1"
      max_minutes:
        default: "300"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install numpy pandas matplotlib && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download ${{ inputs.patches_tag }} -R ${{ github.repository }} -p "l2patches_*.npz" -D patches && ls -la patches && df -h . && free -g
      - run: python ml/l2_train.py --patches patches --out model --max-minutes ${{ inputs.max_minutes }} --threads 4
      - name: Store the model
        if: ${{ always() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ${{ inputs.tag }} -R ${{ github.repository }} >/dev/null 2>&1 || gh release create ${{ inputs.tag }} -R ${{ github.repository }} --prerelease --title "ML single-site model" --notes "MesoNet trained on Level II patches (ml/l2_train.py)"
          gh release upload ${{ inputs.tag }} -R ${{ github.repository }} model/* --clobber
